version: 1

site:
  name: Purpeon CMS Fixtures
  timezone: Europe/Oslo
  branch: main
  publish_mode: pr

media:
  folder: public/uploads
  public_path: /uploads
  max_size_kb: 4096
  accept: [image/jpeg, image/png, image/webp, image/svg+xml]
  transform:
    strip_exif: true
    max_dimension: 2400

preview:
  mode: deploy_preview

collections:
  - name: pages
    type: folder
    label: Pages
    label_singular: Page
    folder: content/pages
    format: frontmatter-md
    body_field: body
    create: true
    delete: true
    slug:
      template: "{{fields.title | slugify}}"
    preview:
      permalink: "/{{slug}}"
    list:
      summary: "{{fields.title}}"
      columns: [title, status, commit.updated_at]
      sortable_fields: [title, commit.updated_at]
      default_sort:
        field: commit.updated_at
        order: desc
      filters:
        - name: status
          label: Status
          field: status
    fields:
      - name: title
        type: string
        required: true
        validate:
          - rule: max_length
            value: 70
      - name: status
        type: select
        default: draft
        options: [draft, published]
      - name: hero
        type: image
        fields:
          alt: required
          dimensions: true
      - name: featured
        type: boolean
        label: Featured on the front page
      - name: publish_at
        type: datetime
        label: Publish at
        storage: iso_offset
        timezone: site
      - name: sections
        type: list
        label: Page sections
        label_singular: Section
        type_key: type
        max: 30
        summary: "{{item.heading | default:'(untitled section)'}}"
        types:
          - name: hero
            label: Hero
            fields:
              - name: heading
                type: string
                required: true
              - name: body
                type: markdown
          - name: feature_grid
            label: Feature grid
            fields:
              - name: columns
                type: number
                value_type: int
                default: 3
                min: 2
                max: 4
              - name: items
                type: list
                label: Features
                label_singular: Feature
                min: 1
                max: 12
                summary: "{{item.title}}"
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: text
                    type: text
      - name: seo
        type: object
        label: Search and sharing
        collapsed: true
        fields:
          - name: title
            type: string
            validate:
              - rule: max_length
                value: 60
          - name: description
            type: text
      - name: body
        type: markdown
        label: Body
      - name: layout
        type: hidden
        value: default

  - name: settings
    type: file
    label: Settings
    files:
      - name: navigation
        label: Navigation
        file: content/settings/navigation.yaml
        format: yaml
        fields:
          - name: heading
            type: string
            required: true
